<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Character Flow</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="page prose">
    <header class="site-header"><a class="brand" href="/">Character Flow</a></header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer muted">
      Character Flow is a free hobby project.
      <a href="/faq">FAQ</a> · <a href="/stats">Stats</a> · <a href="https://github.com/pberry/character-flow">Source on GitHub</a>.
    </footer>
  </div>
</body>
</html>
