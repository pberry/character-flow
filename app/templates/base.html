<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Character Flow</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  {%- set url = config.BASE_URL + request.path %}
  <link rel="canonical" href="{{ url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Character Flow">
  <meta property="og:title" content="{{ self.title() }} · Character Flow">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ url }}">
  <meta property="og:image" content="{{ config.BASE_URL }}/static/media/social-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Character Flow: a combat flowchart for a level 5 rogue, with decision diamonds leading to Sneak Attack.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#7a2e2e">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="page prose">
    <header class="site-header"><a class="brand" href="/">Character Flow</a></header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer muted">
      Character Flow is a free hobby project.
      <a href="/faq">FAQ</a> · <a href="/stats">Stats</a> · <a href="https://github.com/pberry/character-flow">Source on GitHub</a>.
    </footer>
  </div>
</body>
</html>
